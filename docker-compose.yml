services:
  # ==================== INFRAESTRUCTURA ====================
  discovery-server:
    build: ./discovery-server
    container_name: soa-discovery
    ports:
      - "8761:8761"
    env_file: .env
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  config-server:
    build: ./config-server
    container_name: soa-config
    ports:
      - "8888:8888"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: soa-redis
    ports:
      - "6380:6379"
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-auditoria:
    image: postgres:16-alpine
    container_name: soa-postgres-auditoria
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_NAME_AUDITORIA}
      POSTGRES_USER: ${DB_USERNAME_AUDITORIA}
      POSTGRES_PASSWORD: ${DB_PASSWORD_AUDITORIA}
    volumes:
      - postgres-auditoria-data:/var/lib/postgresql/data
    networks:
      - soa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_AUDITORIA} -d ${DB_NAME_AUDITORIA}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: soa-keycloak
    ports:
      - "9080:9080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: keycloak
      KC_HTTP_PORT: 9080
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev"]
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./api-gateway
    container_name: soa-gateway
    ports:
      - "8889:8889"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  # ==================== BFF ====================
  bff:
    build: ./bff
    container_name: soa-bff
    ports:
      - "7443:7443"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started

  # ==================== MICROSERVICIOS ====================
  servicio-usuarios:
    build: ./servicios/usuarios
    container_name: soa-usuarios
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-clientes:
    build: ./servicios/clientes
    container_name: soa-clientes
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-mesas:
    build: ./servicios/mesas
    container_name: soa-mesas
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-qr:
    build: ./servicios/qr
    container_name: soa-qr
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-ventas:
    build: ./servicios/ventas
    container_name: soa-ventas
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-cocina:
    build: ./servicios/cocina
    container_name: soa-cocina
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-inventario:
    build: ./servicios/inventario
    container_name: soa-inventario
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-finanzas:
    build: ./servicios/finanzas
    container_name: soa-finanzas
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-auditoria:
    build: ./servicios/auditoria
    container_name: soa-auditoria
    ports:
      - "8089:8089"
    env_file: .env
    environment:
      DB_HOST_AUDITORIA: postgres-auditoria
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-auditoria:
        condition: service_healthy

  # ==================== ORQUESTADOR ====================
  orquestador:
    build: ./orchestrator
    container_name: soa-orquestador
    ports:
      - "8080:8080"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      config-server:
        condition: service_healthy

networks:
  soa-network:
    driver: bridge

volumes:
  postgres-auditoria-data:
  keycloak-data:
