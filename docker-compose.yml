services:
  # ==================== INFRAESTRUCTURA ====================
  discovery-server:
    build: ./discovery-server
    container_name: soa-discovery
    ports:
      - "8761:8761"
    env_file: .env
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: soa-config
    ports:
      - "8888:8888"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soa-redis
    ports:
      - "6379:6379"
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: soa-keycloak
    ports:
      - "9080:9080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 9080
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev"]
    networks:
      - soa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./api-gateway
    container_name: soa-gateway
    ports:
      - "8889:8889"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  # ==================== BFF ====================
  bff:
    build: ./bff
    container_name: soa-bff
    ports:
      - "7443:7443"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      redis:
        condition: service_healthy
      api-gateway:
        condition: service_started

  # ==================== MICROSERVICIOS ====================
  servicio-usuarios:
    build: ./servicios/usuarios
    container_name: soa-usuarios
    ports:
      - "8081:8081"
    env_file: ./servicios/usuarios/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-clientes:
    build: ./servicios/clientes
    container_name: soa-clientes
    ports:
      - "8082:8082"
    env_file: ./servicios/clientes/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-mesas:
    build: ./servicios/mesas
    container_name: soa-mesas
    ports:
      - "8083:8083"
    env_file: ./servicios/mesas/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-qr:
    build: ./servicios/qr
    container_name: soa-qr
    ports:
      - "8084:8084"
    env_file: ./servicios/qr/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-ventas:
    build: ./servicios/ventas
    container_name: soa-ventas
    ports:
      - "8085:8085"
    env_file: ./servicios/ventas/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-cocina:
    build: ./servicios/cocina
    container_name: soa-cocina
    ports:
      - "8086:8086"
    env_file: ./servicios/cocina/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-inventario:
    build: ./servicios/inventario
    container_name: soa-inventario
    ports:
      - "8087:8087"
    env_file: ./servicios/inventario/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  servicio-finanzas:
    build: ./servicios/finanzas
    container_name: soa-finanzas
    ports:
      - "8088:8088"
    env_file: ./servicios/finanzas/.env
    networks:
      - soa-network
    depends_on:
      discovery-server:
        condition: service_healthy

  # ==================== ORQUESTADOR ====================
  orquestador:
    build: ./orchestrator
    container_name: soa-orquestador
    ports:
      - "8080:8080"
    env_file: .env
    networks:
      - soa-network
    depends_on:
      config-server:
        condition: service_healthy

networks:
  soa-network:
    driver: bridge
