version: '3.8'

services:
  servicio-usuarios:
    build: ./servicios/usuarios
    container_name: soa-usuarios
    ports:
      - "8081:8080"
    networks:
      - soa-network

  servicio-qr:
    build: ./servicios/qr
    container_name: soa-qr
    ports:
      - "8082:8080"
    networks:
      - soa-network

  servicio-clientes:
    build: ./servicios/clientes
    container_name: soa-clientes
    ports:
      - "8083:8080"
    networks:
      - soa-network

  servicio-ventas:
    build: ./servicios/ventas
    container_name: soa-ventas
    ports:
      - "8084:8080"
    networks:
      - soa-network

  orquestador:
    build: ./orchestrator
    container_name: soa-orquestador
    ports:
      - "8080:8080"
    environment:
      - SERVICE_USUARIOS_URL=http://servicio-usuarios:8080
      - SERVICE_QR_URL=http://servicio-qr:8080
      - SERVICE_CLIENTES_URL=http://servicio-clientes:8080
      - SERVICE_VENTAS_URL=http://servicio-ventas:8080
    networks:
      - soa-network
    depends_on:
      - servicio-usuarios
      - servicio-qr
      - servicio-clientes
      - servicio-ventas

networks:
  soa-network:
    driver: bridge