services:
  servicio-usuarios:
    build: ./servicios/usuarios
    container_name: soa-usuarios
    ports:
      - "8081:8081"
    networks:
      - soa-network
  servicio-clientes:
    build: ./servicios/clientes
    container_name: soa-clientes
    ports:
      - "8082:8082"
    networks:
      - soa-network
  servicio-mesas:
    build: ./servicios/mesas
    container_name: soa-mesas
    ports:
      - "8083:8083"
    networks:
      - soa-network
  servicio-qr:
    build: ./servicios/qr
    container_name: soa-qr
    ports:
      - "8084:8084"
    networks:
      - soa-network

  servicio-ventas:
    build: ./servicios/ventas
    container_name: soa-ventas
    ports:
      - "8085:8085"
    networks:
      - soa-network
  servicio-cocina:
    build: ./servicios/cocina
    container_name: soa-cocina
    ports:
      - "8086:8086"
    networks:
      - soa-network
  servicio-inventario:
    build: ./servicios/inventario
    container_name: soa-inventario
    ports:
      - "8087:8087"
    networks:
      - soa-network
  servicio-finanzas:
    build: ./servicios/finanzas
    container_name: soa-finanzas
    ports:
      - "8088:8088"
    networks:
      - soa-network

  orquestador:
    build: ./orchestrator
    container_name: soa-orquestador
    ports:
      - "8080:8080"
    environment:
      - SERVICE_USUARIOS_URL=http://servicio-usuarios:8081/api/v1
      - SERVICE_CLIENTES_URL=http://servicio-clientes:8082/api/v1
      - SERVICE_MESAS_URL=http://servicio-mesas:8083/api/v1
      - SERVICE_QR_URL=http://servicio-qr:8084/api/v1
      - SERVICE_VENTAS_URL=http://servicio-ventas:8085/api/v1
      - SERVICE_COCINA_URL=http://servicio-cocina:8086/api/v1
      - SERVICE_INVENTARIO_URL=http://servicio-inventario:8087/api/v1
      - SERVICE_FINANZAS_URL=http://servicio-finanzas:8088/api/v1   # <<--- NUEVA
    networks:
      - soa-network

networks:
  soa-network:
    driver: bridge