server:
  port: 7443

spring:
  application:
    name: bff
  cloud:
    gateway:
      routes:
        - id: api-gateway
          uri: http://localhost:8889
          predicates:
            - Path=/api/**
          filters:
            - TokenRelay=

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:bff-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL:http://localhost:9080}/realms/${KEYCLOAK_REALM:donbelisario}
            user-name-attribute: preferred_username

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: bff:session

  data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: "*"
