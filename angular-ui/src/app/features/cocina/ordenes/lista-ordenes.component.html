<div class="h-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 overflow-y-auto">
  @for (col of columnas(); track col.estado) {
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2 px-1">
        <span class="text-sm font-bold uppercase tracking-wide"
          [class.text-red-600]="col.estado === 'PENDIENTE'"
          [class.text-yellow-600]="col.estado === 'PREPARANDO'"
          [class.text-green-600]="col.estado === 'LISTO'"
          [class.text-gray-500]="col.estado === 'ENTREGADO'"
        >
          {{ col.label }}
        </span>
        <span class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full font-semibold">
          {{ col.ordenes.length }}
        </span>
      </div>

      @for (orden of col.ordenes; track orden.id) {
        <app-tarjeta-orden [orden]="orden" (estadoCambiado)="estadoCambiado.emit()" />
      } @empty {
        <div class="text-center text-gray-300 text-sm py-8 border-2 border-dashed border-gray-100 rounded-xl">
          Sin órdenes
        </div>
      }
    </div>
  }
</div>
